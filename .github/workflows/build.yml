name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  package:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore persistent Android signing key
        if: matrix.target == 'apk'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Verify Windows update shutdown, restart and rollback
        if: matrix.target == 'windows'
        run: flutter test test/updater_test.dart test/update_helper_test.dart test/update_lifecycle_test.dart
      - run: flutter build ${{ matrix.target }} --release
        env:
          ANDROID_SIGNING_STORE_PASSWORD: android
          ANDROID_SIGNING_KEY_ALIAS: androiddebugkey
          ANDROID_SIGNING_KEY_PASSWORD: android
      - name: Ensure Inno Setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }
      - name: Windows installer and portable updater package
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipBuild
      - name: macOS archive
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/dreamlight_companion.app dist/DreamlightCompanion-macOS.zip
      - name: Android artifact
        if: matrix.target == 'apk'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DreamlightCompanion-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dreamlight-${{ matrix.target }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.zip dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
