name: Refresh catalog data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
concurrency:
  group: catalog-collector
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/wiki-source-cache
          key: wiki-source-v2-${{ github.run_id }}
          restore-keys: wiki-source-v2-
      - run: python -m pip install beautifulsoup4==4.12.2
      - name: Collect paced wiki tables and a bounded number of detail pages
        id: collect
        continue-on-error: true
        run: python scripts/build-catalog.py --refresh-collections
      - name: Keep the previous snapshot when the source refuses collection
        if: steps.collect.outcome != 'success'
        run: echo '::warning::Wiki access was refused or its structure changed. The previous catalog remains published; no new source data was published.'
      - name: Publish validated data feed
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/catalog.json data/catalog.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh shared wiki catalog data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

